<style>
:root{
  --charcoal:#231F20;
  --gold:#E6AD19;
  --gold-deep:#8A5D08;
  --ink-on-dark:#EDE8E0;
  --ink-muted:#A39E96;
  --line-dark:rgba(237,232,224,0.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Inter',sans-serif;
  background:var(--charcoal);
  color:var(--ink-on-dark);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  padding:32px;
  overflow-x:hidden;
}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:520px;text-align:center;position:relative}
.glow{
  position:absolute;top:-40px;left:50%;transform:translateX(-50%);
  width:420px;height:420px;
  background:radial-gradient(circle,rgba(230,173,25,0.10) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}
.mono{position:relative;z-index:1;width:112px;height:auto;margin:0 auto 32px;display:block;filter:drop-shadow(0 12px 30px rgba(230,173,25,0.18))}
.eyebrow{
  position:relative;z-index:1;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:14px;
}
h1{
  position:relative;z-index:1;
  font-family:'Fraunces',serif;font-optical-sizing:auto;font-weight:500;
  font-size:clamp(30px,5vw,42px);line-height:1.15;letter-spacing:-0.01em;
  color:var(--ink-on-dark);margin-bottom:16px;
}
h1 em{font-style:normal;color:var(--gold)}
p{position:relative;z-index:1;font-size:16px;color:var(--ink-muted);max-width:400px;margin:0 auto 34px}
.actions{position:relative;z-index:1;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
a{color:inherit;text-decoration:none}
.btn-primary{
  background:var(--gold);color:var(--charcoal);padding:14px 28px;border-radius:2px;
  font-weight:600;font-size:15px;transition:transform .25s,box-shadow .25s;
  box-shadow:0 8px 30px rgba(223,175,69,0.18);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(223,175,69,0.3)}
.btn-ghost{
  border:1px solid var(--line-dark);color:var(--ink-on-dark);padding:14px 26px;border-radius:2px;
  font-weight:500;font-size:15px;transition:border-color .25s,background .25s;
}
.btn-ghost:hover{border-color:var(--gold);background:rgba(223,175,69,0.06)}
.terr{
  position:relative;z-index:1;margin-top:44px;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#6B665D;letter-spacing:0.08em;
}
.terr b{color:var(--gold-deep)}
@media(max-width:480px){
  .actions{flex-direction:column;align-items:stretch}
}
</style>
</head>
